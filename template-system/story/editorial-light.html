<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S — Editorial Light</title>
<style>
@font-face{font-family:'TCM';src:url('../assets/fonts/TwCenMT-Regular.ttf');font-weight:400;font-style:normal;}
@font-face{font-family:'TCM';src:url('../assets/fonts/TwCenMT-Bold.ttf');font-weight:700;font-style:normal;}
@font-face{font-family:'TCM';src:url('../assets/fonts/TwCenMT-Italic.ttf');font-weight:400;font-style:italic;}
@font-face{font-family:'TCM';src:url('../assets/fonts/TwCenMT-BoldItalic.ttf');font-weight:700;font-style:italic;}
@font-face{font-family:'TCMC';src:url('../assets/fonts/TwCenMT-Condensed.ttf');font-weight:400;}
@font-face{font-family:'TCMC';src:url('../assets/fonts/TwCenMT-CondensedBold.ttf');font-weight:700;}
@font-face{font-family:'TCMC';src:url('../assets/fonts/TwCenMT-CondensedExtraBold.ttf');font-weight:800;}
@font-face{font-family:'Dosis';src:url('../assets/fonts/Dosis-ExtraLight.ttf');font-weight:200;}
@font-face{font-family:'Dosis';src:url('../assets/fonts/Dosis-Light.ttf');font-weight:300;}
@font-face{font-family:'Dosis';src:url('../assets/fonts/Dosis-Book.ttf');font-weight:400;}
@font-face{font-family:'Dosis';src:url('../assets/fonts/Dosis-Medium.ttf');font-weight:500;}
@font-face{font-family:'Dosis';src:url('../assets/fonts/Dosis-SemiBold.ttf');font-weight:600;}
@font-face{font-family:'Dosis';src:url('../assets/fonts/Dosis-Bold.ttf');font-weight:700;}
@font-face{font-family:'Dosis';src:url('../assets/fonts/Dosis-ExtraBold.ttf');font-weight:800;}

*{margin:0;padding:0;box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:#0E0C09;display:grid;place-items:center;min-height:100vh;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
.export{width:1080px;height:1920px;position:relative;overflow:hidden;
  font-family:'Dosis',sans-serif;background:#131009;}
img{display:block;}
.noise{position:absolute;inset:0;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='260' height='260' filter='url(%23n)' opacity='0.5'/></svg>");
  background-size:260px 260px;opacity:.45;mix-blend-mode:overlay;pointer-events:none;z-index:6;}
.hdr{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;
  justify-content:space-between;padding:52px 72px 0;z-index:20;}
.hdr img{height:66px;width:auto;}
.hdr .sec{font-family:'Dosis';font-weight:700;font-size:27px;letter-spacing:8px;
  text-transform:uppercase;color:var(--accent);padding-left:8px;}
.eyebrow{display:flex;align-items:center;gap:18px;font-family:'Dosis';font-weight:700;
  font-size:25px;letter-spacing:7px;text-transform:uppercase;color:var(--accent);}
.eyebrow::before{content:'';width:54px;height:4px;background:var(--accent);flex:none;}
.vtext{position:absolute;left:30px;bottom:150px;writing-mode:vertical-rl;
  transform:rotate(180deg);font-family:'Dosis';font-weight:600;font-size:20px;
  letter-spacing:6px;text-transform:uppercase;z-index:12;}
.bignum{position:absolute;font-family:'TCMC';font-weight:800;line-height:.8;
  color:transparent;-webkit-text-stroke:3px var(--accent);opacity:.16;z-index:1;
  pointer-events:none;user-select:none;}
.wm{position:absolute;right:-14%;bottom:-8%;height:88%;opacity:.07;
  filter:brightness(2.6);z-index:1;pointer-events:none;}
.tint{position:absolute;inset:0;background:var(--dark);mix-blend-mode:soft-light;
  opacity:.55;pointer-events:none;}
.byline{display:flex;align-items:center;gap:22px;}
.byline img{width:64px;height:64px;border-radius:50%;object-fit:cover;
  border:3px solid var(--accent);}
.byline .who{font-family:'Dosis';font-weight:600;font-size:26px;letter-spacing:4px;
  text-transform:uppercase;}
.byline .who small{display:block;font-weight:400;font-size:19px;letter-spacing:5px;
  opacity:.6;margin-bottom:4px;}
</style>
</head>
<body>
<div class="export">

<div style="position:absolute;inset:0;background:#F6F2EA;"></div>
<div style="position:absolute;top:0;left:0;right:0;height:31%;overflow:hidden;">
  <img src="{{HERO_IMAGE}}" alt="" style="width:100%;height:100%;object-fit:cover;">
  <div class="tint"></div>
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,8,5,.55) 0%,rgba(10,8,5,0) 42%);"></div>
</div>
<div style="position:absolute;top:31%;left:0;right:0;height:8px;background:var(--accent);z-index:12;"></div>
<div class="bignum" style="font-size:660px;right:-60px;bottom:-110px;opacity:.08;">KG</div>
<div class="hdr"><img src="../assets/logo-light.svg" alt="logo"><span class="sec">{{SECTION_NAME}}</span></div>
<span class="vtext" style="color:rgba(34,29,22,.35);bottom:340px;">{{SECTION_NAME_UPPER}} &nbsp;&mdash;&nbsp; insights.kghub.ca</span>
<div style="position:absolute;left:150px;right:150px;top:36%;z-index:10;">
  <div class="eyebrow" style="margin-bottom:48px;">{{LABEL}}</div>
  <h1 style="font-family:'TCM';font-weight:700;font-size:96px;line-height:1.04;letter-spacing:-1px;color:#221D16;margin-bottom:52px;">{{ART_TITLE}}</h1>
  <div style="width:130px;height:8px;background:var(--accent);margin-bottom:52px;"></div>
  <p style="font-family:'Dosis';font-weight:400;font-size:42px;line-height:1.55;color:#4B443A;max-width:760px;">{{HOOK}}</p>
  <div class="byline" style="color:#221D16;margin-top:72px;">
    <img src="{{WRITER_PHOTO}}" alt="" style="width:72px;height:72px;">
    <span class="who"><small style="opacity:.5;">Words</small>{{WRITER_NAME_UPPER}}</span>
  </div>
</div>

</div>
<script>
(function () {
  var C = { accent: ["{{COLOR_ACCENT}}", "#D9962B"],
            light:  ["{{COLOR_LIGHT}}",  "#EDBE6E"],
            dark:   ["{{COLOR_DARK}}",   "#7E5410"] };
  var rs = document.documentElement.style;
  for (var k in C) { var v = C[k][0]; if (v.slice(0, 2) === "{" + "{") v = C[k][1]; rs.setProperty("--" + k, v); }
  var ex = document.querySelector(".export");
  if (ex.innerHTML.indexOf("{" + "{") > -1) {
    var S = {"SECTION_NAME": "KG Build", "SECTION_NAME_UPPER": "KG BUILD", "WRITER_NAME": "Joseph Bennett", "WRITER_NAME_UPPER": "JOSEPH BENNETT", "WRITER_PHOTO": "../assets/joseph.jpg", "HERO_IMAGE": "../assets/hero-default.jpg", "ART_TITLE": "The Quiet Rise of Mass Timber in Mid-Rise Housing", "HOOK": "Concrete built the last century. Wood will build the next.", "LABEL": "FIELD NOTES", "NARRATIVE": "Across the country, mid-rise developers are trading concrete cores for cross-laminated timber &mdash; and the math is starting to favour them. Lighter structures mean smaller foundations, faster schedules, and job sites that sound more like carpentry shops than pour lines.", "QUOTE": "We stopped asking how tall we could build and started asking how well.", "STAT_N": "63%", "STAT_L": "of new mid-rise proposals filed in 2026 specify engineered timber structures", "IMGBOX_CAPTION": "An eight-storey CLT frame topped out in three weeks &mdash; Fable District, March 2026", "END_CARD_BIO": "Joseph writes about construction methods, materials, and the crews that put buildings together. Fourteen years on job sites, from foundations to closeout.", "FEAT_1_LABEL": "Faster schedules", "FEAT_1_DESC": "Prefabricated panels cut framing time by weeks, not days", "FEAT_2_LABEL": "Lighter structure", "FEAT_2_DESC": "Roughly one-fifth the weight of an equivalent concrete frame", "FEAT_3_LABEL": "Cleaner sites", "FEAT_3_DESC": "Fewer trades on site, less noise, dramatically less waste", "FEAT_4_LABEL": "Carbon story", "FEAT_4_DESC": "Timber stores carbon instead of emitting it during production", "STEP_1_TITLE": "Check your zoning", "STEP_1_DESC": "Most codes now allow mass timber up to twelve storeys", "STEP_2_TITLE": "Price the shell early", "STEP_2_DESC": "Timber wins on schedule, not sticker price &mdash; model both", "STEP_3_TITLE": "Book the supplier", "STEP_3_DESC": "CLT plants run long lead times; lock capacity before design freeze"};
    ex.innerHTML = ex.innerHTML.replace(/\{\{([A-Z0-9_]+)\}\}/g,
      function (m, key) { return S.hasOwnProperty(key) ? S[key] : m; });
  }
})();
</script>
</body>
</html>
